<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background-color:#f5f5f5;
}

header{
  background-color:#333;
  color:white;
  padding:15px;
  text-align:center;
}

nav{
  margin-top:10px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 10px;
  padding:8px 12px;
  border-radius:5px;
}

nav a:hover{
  background-color:#555;
}

section{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery-item{
  position:relative;
  cursor:pointer;
}

.gallery-item img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
  transition:transform 0.3s ease;
}

.gallery-item img:hover{
  transform:scale(1.05);
}

/* Popup Background */
.popup{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
  padding:20px;
}

/* Popup Box */
.popup-content{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:700px;
  width:90%;
  text-align:center;
  position:relative;
}

.popup-content img{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:10px;
}

.popup-content h2{
  margin-top:15px;
}

.popup-content p{
  color:#444;
}

/* Close Button */
.close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:30px;
  cursor:pointer;
  color:black;
}

footer{
  text-align:center;
  padding:15px;
  background:#333;
  color:white;
  margin-top:20px;
}
</style>
</head>

<script>
function openPopup(imageSrc, title, description){

document.getElementById("popup").style.display = "flex";

document.getElementById("popup-img").src = imageSrc;

document.getElementById("popup-title").innerText = title;

document.getElementById("popup-description").innerText = description;
}

function closePopup(){
document.getElementById("popup").style.display = "none";
}

/* Close popup when clicking outside */
window.onclick = function(event){

let popup = document.getElementById("popup");

if(event.target == popup){
popup.style.display = "none";
}
}
</script>
